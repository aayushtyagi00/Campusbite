<h2>Reset your CampusBite password</h2>
<p><a href="{{ .RedirectTo }}#recovery={{ .TokenHash }}">Choose a new password</a></p>
<p>You can also enter this verification code on the recovery screen: <strong>{{ .Token }}</strong>.</p>
<p>Use the latest email within one hour, or sooner if the code expires. If you did not request a password reset, you can ignore this email.</p>
